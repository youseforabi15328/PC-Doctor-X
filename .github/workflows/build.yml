name: Build PCDoctorX

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip psutil pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --uac-admin --name PCDoctorX --icon icon.ico app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PCDoctorX
          path: dist/PCDoctorX.exe
      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCDoctorX.exe
